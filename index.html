<!DOCTYPE html>
<html>
<head>
  <title>Subdomain Portal Login</title>
</head>
<body>
  <form id="loginForm">
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Sign In</button>
  </form>
  <p id="status"></p>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWioC8mFp-jsKPYr6Xe9k2ZbDfKDYnSxI6DjlquuSOaW-WUx2QLvLBsAmsy-QankqaOQ/exec";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "login", email, password })
      });

      const result = await response.json();
      if (result.success) {
        localStorage.setItem("auth_token", result.token);
        document.getElementById("status").textContent = `Logged in as ${result.role}`;
      } else {
        document.getElementById("status").textContent = result.message;
      }
    });
  </script>
</body>
</html>
